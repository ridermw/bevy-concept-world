[package]
name = "bevy-concept-world"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
bevy = "=0.19.1"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
